name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  vision-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # sounddevice loads libportaudio at import time, so vision/audio_agent.py is
      # unimportable without it — the wheel on its own is not enough.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -r vision/requirements-test.txt
      # `python -m pytest`, not bare `pytest`: the tests import `vision.*` and the
      # server contract, and only the module form puts the repo root on sys.path.
      # Bare pytest fails collection with ModuleNotFoundError: No module named 'vision'.
      - run: python -m pytest -q vision/tests
