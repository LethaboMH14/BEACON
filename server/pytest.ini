[pytest]
# BEACON server test configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Verbose output
addopts = -v --tb=short

# Markers
markers =
    contract: Contract validation tests (VUKA-style shape checking)
    slow: Slow tests (integration, load)
